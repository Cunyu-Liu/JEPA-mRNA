# Frozen task registry for the RNA-JEPA vs mRNABERT head-to-head study.
#
# Do not edit without bumping `version` AND recording the change in the
# experiment ledger: this file is the protocol other numbers are compared
# against, and task keys are used verbatim in every artefact path.
#
# Fields
#   family   : task family, used for the Fig.3 facets (7 families must be covered)
#   kind     : regression | binary_classification | multiclass_classification
#   split    : official tokenisation mode (utr | codon | complete), see
#              src/rnajepa/tokenization.py.  `complete` needs [ ] CDS markers.
#   source   : sub-directory inside the extracted Zenodo 17786045 bundle
#   max_len  : token budget passed to both the tokenizer and the model
#   batch    : per-device train batch size
#   epochs   : train epochs (regression 20 / classification 1 = official default)
#   paper    : the value reported in the mRNABERT paper (xlsx sheet 04_关键结果),
#              kept here so the reproduction gate can be evaluated offline
#   metric   : the paper's primary metric key
version: 1
tasks:
  cds_mrfp:
    family: CDS
    kind: regression
    split: codon
    source: CDS/mRFP
    max_len: 256
    batch: 16
    epochs: 20
    metric: spearman
    paper: 0.89
  cds_fungal:
    family: CDS
    kind: regression
    split: codon
    source: CDS/Fungal
    max_len: 1024
    batch: 8
    epochs: 20
    metric: spearman
    paper: 0.89
  cds_ecoli:
    family: CDS
    kind: multiclass_classification
    split: codon
    source: CDS/Ecoli
    max_len: 1024
    batch: 8
    epochs: 1
    metric: accuracy
    paper: 0.58
  cds_stability:
    family: CDS
    kind: regression
    split: codon
    source: CDS/Stability
    max_len: 512
    batch: 8
    epochs: 20
    metric: spearman
    paper: 0.56
  cds_cov:
    family: CDS
    kind: regression
    split: codon
    source: CDS/SARS-CoV-2
    max_len: 128
    batch: 16
    epochs: 20
    metric: spearman
    paper: 0.89
  rbp_1:
    family: 3UTR-RBP
    kind: binary_classification
    split: utr
    source: 3UTR/RBP
    max_len: 128
    batch: 16
    epochs: 1
    metric: accuracy
    paper: 0.786
  m6a_HEK293T_fold0:
    family: 3UTR-m6A
    kind: binary_classification
    split: utr
    source: 3UTR/m6A
    max_len: 128
    batch: 16
    epochs: 1
    metric: accuracy
    paper: 0.966
  apa_usage:
    family: APA
    kind: regression
    split: utr
    source: 3UTR/APA
    max_len: 512
    batch: 8
    epochs: 20
    metric: spearman
    paper: 0.916
  utr5_U1:
    family: 5UTR-MRL
    kind: regression
    split: utr
    source: 5UTR/U1
    max_len: 64
    batch: 16
    epochs: 20
    metric: spearman
    paper: 0.962
  full_in_cell_half_life:
    family: full-length
    kind: regression
    split: complete
    source: full_length/in_cell_half_life
    max_len: 1024
    batch: 8
    epochs: 20
    metric: r2
    paper: 0.769
  protein_solubility:
    family: protein
    kind: regression
    split: codon
    source: protein/solubility
    max_len: 512
    batch: 8
    epochs: 20
    metric: r2
    paper: 0.63
  te_human:
    family: ultra-long-TE
    kind: regression
    split: complete
    source: te_ultra_full_length/human
    max_len: 3066
    batch: 1
    epochs: 20
    metric: r2
    paper: 0.669