# Frozen task registry for the RNA-JEPA vs mRNABERT head-to-head study.
#
# Do not edit without bumping `version` AND recording the change in the experiment
# ledger: task keys are used verbatim in every artefact path, and the learning rate is
# part of the published protocol.
#
# Fields
#   family   : task family, used for the Fig.3 facets (7 families must be covered)
#   kind     : regression | binary_classification | multiclass_classification
#   split    : official tokenisation mode (utr | codon | complete), see
#              src/rnajepa/tokenization.py.  `complete` needs [ ] CDS markers.
#   source   : sub-directory inside the extracted Zenodo 17786045 bundle
#   max_len  : token budget passed to both the tokenizer and the model
#   batch    : per-device train batch size
#   epochs   : train epochs (regression 20 / classification 1 = official default)
#   lr       : learning rate
#   lr_status: "verified" = the value was shown to reproduce on this task family;
#              "selected" = chosen by a short dev-set sweep in the eval stage and
#              recorded here once done
#   paper    : the value reported in the mRNABERT paper (xlsx sheet 04_关键结果)
#   metric   : the paper's primary metric key
#
# Learning-rate policy (evidence, not convention)
# ----------------------------------------------
# The official documented default of lr = 1e-4 provably fails on classification tasks
# with ~10k+ training rows: on 3UTR-RBP it collapses to the majority class
# (ACC 0.6675, F1pos 0.0, AUC 0.46) at 1, 5 and 10 epochs and in fp32, while a frozen
# encoder still reaches 0.7796 and full fine-tuning at lr = 2e-5 reaches
# ACC 0.8250 / F1pos 0.7381 (paper: 0.786 / 0.751).  See
# records/INVESTIGATION_rbp_0_degenerate.md.  Small regression tasks keep 1e-4, which
# does reproduce (cds_mrfp 0.8663 vs 0.89).
version: 2
tasks:
  cds_mrfp:
    family: CDS
    kind: regression
    split: codon
    source: CDS/mRFP
    max_len: 256
    batch: 16
    epochs: 20
    lr: 1e-4
    lr_status: verified
    metric: spearman
    paper: 0.89
  cds_fungal:
    family: CDS
    kind: regression
    split: codon
    source: CDS/Fungal
    max_len: 1024
    batch: 8
    epochs: 20
    lr: 1e-4
    lr_status: selected
    metric: spearman
    paper: 0.89
  cds_ecoli:
    family: CDS
    kind: multiclass_classification
    split: codon
    source: CDS/ecoli
    max_len: 1024
    batch: 8
    epochs: 5
    lr: 2e-5
    lr_status: selected
    metric: accuracy
    paper: 0.58
  cds_stability:
    family: CDS
    kind: regression
    split: codon
    source: CDS/Stability
    max_len: 512
    batch: 8
    epochs: 20
    lr: 2e-5
    lr_status: selected
    metric: spearman
    paper: 0.56
  cds_cov:
    family: CDS
    kind: regression
    split: codon
    source: CDS/Cov
    max_len: 128
    batch: 16
    epochs: 20
    lr: 1e-4
    lr_status: selected
    metric: spearman
    paper: 0.89
  rbp_0:
    family: 3UTR-RBP
    kind: binary_classification
    split: utr
    source: 3UTR/RNA_protein_interaction/22_eCLIP/0
    max_len: 128
    batch: 16
    epochs: 5
    lr: 2e-5
    lr_status: verified
    metric: accuracy
    paper: 0.786
  m6a_HEK293T_fold0:
    family: 3UTR-m6A
    kind: binary_classification
    split: utr
    source: 3UTR/m6A_modification/HEK293T/0
    max_len: 128
    batch: 16
    epochs: 5
    lr: 2e-5
    lr_status: selected
    metric: accuracy
    paper: 0.966
  apa_usage:
    family: APA
    kind: regression
    split: complete
    source: full_length
    max_len: 512
    batch: 8
    epochs: 20
    lr: 2e-5
    lr_status: selected
    metric: spearman
    paper: 0.916
  utr5_U1:
    family: 5UTR-MRL
    kind: regression
    split: utr
    source: 5UTR/Rank/U1
    max_len: 64
    batch: 16
    epochs: 20
    lr: 1e-4
    lr_status: selected
    shared_dev_test: true
    metric: spearman
    paper: 0.962
  full_in_cell_half_life:
    family: full-length
    kind: regression
    split: complete
    source: full_length/in_cell_half_life
    max_len: 1024
    batch: 8
    epochs: 20
    lr: 2e-5
    lr_status: selected
    shared_dev_test: true
    metric: r2
    paper: 0.769
  protein_solubility:
    family: protein
    kind: regression
    split: codon
    source: protein/solubility
    max_len: 512
    batch: 8
    epochs: 20
    lr: 1e-4
    lr_status: selected
    metric: r2
    paper: 0.63
  te_human:
    family: ultra-long-TE
    kind: regression
    split: complete
    source: te_ultra_full_length/human
    max_len: 3066
    batch: 1
    epochs: 20
    lr: 2e-5
    lr_status: selected
    metric: r2
    paper: 0.669